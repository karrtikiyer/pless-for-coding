# Separate project file for the .venv-vllm environment.
#
# Why a parallel pyproject: vLLM has aggressive CUDA/PyTorch version
# pinning that conflicts with the main pyproject.toml. The .venv-vllm
# is sync'd from this file on the GPU box only (vLLM has no Mac wheels).
#
# Usage (on the GPU box):
#   uv venv .venv-vllm --python 3.12
#   UV_PROJECT_ENVIRONMENT=.venv-vllm uv sync \
#       --project pyproject-vllm.toml --no-install-package torch
#   .venv-vllm/bin/python -m bench.apps.runner --backend vllm ...
#
# The main .venv stays untouched; all existing work (algosim, layer-
# entropy probes, ad-hoc analysis) continues to run against it.
#
# Blackwell note (RTX 5090 / B100 / B200, SM 12.0):
#   * vLLM 0.21.0 ships FlashInfer/torch wheels that don't compile
#     for sm_120 — the engine fails during profile_run with
#     "FlashInfer requires GPUs with sm75 or higher" (misleading;
#     the real cause is the JIT can't target sm_120 under cu124).
#   * vLLM 0.9+ ships torch 2.7 + FlashInfer wheels with sm_120
#     support. Use that on Blackwell pods.
#   * On Ampere/Hopper either version works; we pin >=0.9 because
#     it's a strict superset and avoids a sister-version regression.

[project]
name = "pless-for-coding-vllm"
version = "0.1.0"
description = "vLLM backend overlay for the pless benchmarks. Only installed in .venv-vllm/."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.9.0",
    # The rest mirror the main project's runner-side deps. vllm pulls torch + transformers itself.
    # datasets>=4 removed Python loading-script support; codeparrot/apps still ships apps.py.
    "datasets>=2.21,<3",
    "tqdm",
    "accelerate",
    "hf-transfer>=0.1.9",
    "numpy",
    "human-eval",
    "matplotlib",
    "tiktoken",
    "einops",
    "zss",
    "sentencepiece",
    "codebleu>=0.7.0",
    "tree-sitter-python>=0.23,<0.24",
    "scipy>=1.17.1",
    "adjusttext>=1.3.0",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

# Note: no [[tool.uv.index]] for a custom pytorch wheel here — vLLM ships
# its own torch wheel pinning via PyPI dependency resolution (and on
# 0.9+ that's torch 2.7 with cu128, which covers Blackwell). If vLLM and
# any local torch pin disagree on the GPU box, vLLM wins.
