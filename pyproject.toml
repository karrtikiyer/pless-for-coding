[project]
name = "pless-for-coding"
version = "0.1.0"
description = "Benchmark pless samplers on MBPP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # torch 2.7+ with CUDA 12.8 wheels is the first combination that ships
    # sm_120 kernels for Blackwell GPUs (RTX 5090 / B100 / B200).
    # cu128 wheels remain backward-compatible with Ampere (sm_80) and
    # Hopper (sm_90) GPUs as long as the nvidia driver is >=555.
    "torch>=2.7,<2.8",
    "transformers>=5",
    "datasets<4",
    "tqdm",
    "accelerate",
    "hf-transfer>=0.1.9",
    "numpy",
    "human-eval",
    "matplotlib",
    "tiktoken",
    "einops",
    "zss",
    "sentencepiece",
    "transformers-stream-generator",
    "codebleu>=0.7.0",
    "tree-sitter-python>=0.23,<0.24",
    "scipy>=1.17.1",
    "adjusttext>=1.3.0",
    "anthropic>=0.102.0",
    "diptest>=0.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

