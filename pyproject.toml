[project]
name = "pless-for-coding"
version = "0.1.0"
description = "Benchmark pless samplers on MBPP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # torch 2.11 + cu130 is the stack our H100/Blackwell pod runs.
    # It includes sm_120 (Blackwell) AND sm_100 (Hopper Next) kernels and
    # remains backward-compatible with Ampere (sm_80) and Hopper (sm_90)
    # as long as the nvidia driver is >=580. See requirements-vllm-frozen.txt
    # for the bit-exact captured environment.
    "torch>=2.11,<2.12",
    # torchvision is pulled in transitively by transformers (image_utils.py
    # imports it unconditionally). Match torch 2.11 to avoid ABI mismatch.
    "torchvision>=0.26,<0.27",
    "transformers>=5",
    # datasets>=4.0 removed support for Python loading scripts (e.g.
    # codeparrot/apps ships apps.py). Pin to 2.21+/3.x range so the
    # `trust_remote_code=True` script-loading path keeps working.
    "datasets>=2.21,<3",
    "tqdm",
    "accelerate",
    "hf-transfer>=0.1.9",
    "numpy",
    "human-eval",
    "matplotlib",
    "tiktoken",
    "einops",
    "zss",
    "sentencepiece",
    "transformers-stream-generator",
    "codebleu>=0.7.0",
    "tree-sitter-python>=0.23,<0.24",
    "scipy>=1.17.1",
    "adjusttext>=1.3.0",
    "anthropic>=0.102.0",
    "diptest>=0.11.0",
    "nltk>=3.9.4",
    "scikit-learn>=1.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

